name: Build, verify and deploy multi-architecture container images

on:
  pull_request:
    branches: master
  push:
    branches: '**'
    tags: '*'

jobs:
  buildx:
    permissions:
      packages: write # for pushing ghcr images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare
        id: prepare
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container image for verification
        uses: docker/build-push-action@v7
        with:
          build-args: VERSION=${{ steps.prepare.outputs.version }}
          file: config/Containerfile
          load: true
          tags: bitwaescherei:verify
      - name: Verify container image
        run: .github/verify.sh
        env:
          ENGINE: docker
          IMAGE: bitwaescherei:verify
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # reuses the verified amd64 layers from the buildx cache, only arm64 gets built here
      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          build-args: VERSION=${{ steps.prepare.outputs.version }}
          file: config/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ghcr.io/bitwaescherei/bitwaescherei:${{ steps.prepare.outputs.version }}
